name: vaultx_flutter
description: VaultX zero-knowledge cloud password manager (Flutter Android-first client).
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase (matched major versions for FlutterFire compatibility)
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  google_sign_in: ^6.2.2

  # Cryptography (Argon2id RFC 9106 + AES-256-GCM)
  cryptography: ^2.9.0
  cryptography_flutter: ^2.3.4

  # State management & routing
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1

  # Privacy-preserving k-anonymity breach check (prefix-only HTTP)
  http: ^1.6.0

  # Encrypted offline cache & backup export/import
  path_provider: ^2.1.5
  share_plus: ^13.3.1
  file_picker: ^13.3.2

  # TOTP QR provisioning & scanning
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  test: ^1.25.0

flutter:
  uses-material-design: true
